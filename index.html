<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petdoor App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar">

    <div class="logo">

        <img src="img/logo.png" alt="Logo Petdoor">

        <span>
            <span class="logo-p">P</span>etdoor
        </span>

    </div>

    <ul class="nav-links">

        <li><a href="index.html">Inicio</a></li>
        <li><a href="estadisticas.html">Estadísticas</a></li>

    </ul>

</nav>

<section class="app-section">

        <div class="phone">

            <div class="screen">

                <div class="pet-name-area">

                    <input 
                        type="text" 
                        id="petNameInput" 
                        placeholder="Nombre de la mascota"
                    >

                    <button class="save-name-btn" onclick="cambiarNombre()">
                        Guardar
                    </button>

                </div>

                <h2 id="petName">
                    Mascota
                </h2>

                <div class="door-status">

                    <p>Estado de puerta</p>

                    <h1 id="estado">
                        CERRADA
                    </h1>

                </div>

                <div class="controls">

                    <button class="open-btn" onclick="abrirPuerta()">
                        Abrir Puerta
                    </button>

                    <button class="close-btn" onclick="cerrarPuerta()">
                        Cerrar Puerta
                    </button>

                </div>

                <div class="logs">

                    <h3>Últimos movimientos</h3>

                    <ul>

                        <li>08:10 → Entrada</li>
                        <li>10:45 → Salida</li>
                        <li>13:20 → Entrada</li>
                        <li>18:05 → Salida</li>

                    </ul>

                </div>

            </div>

        </div>

    </section>

<script type="module" src="script.js"></script>

</body>
</html>
