<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Petdoor</title>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <h2>PET DOOR</h2>
      <p>Control de Acceso</p>
    </div>

    <nav class="menu">
      <a href="#" class="active">🚪 Abrir Puerta</a>
      <a href="#">📋 Historial</a>
      <a href="#">⚙ Reporte Semanal</a>
    </nav>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <h1>Panel Principal</h1>

      <div class="status">
        <span class="dot online"></span>
        Sistema conectado
      </div>
    </header>

    <!-- TARJETAS -->
    <section class="cards">

      <div class="card">
        <h3>Estado de la puerta</h3>
        <p class="big-text open">ABIERTA</p>
      </div>

      <div class="card">
        <h3>Último acceso</h3>
        <p>Juan Pérez</p>
        <small>07/05/2026 - 14:32</small>
      </div>

      <div class="card">
        <h3>Modo seguridad</h3>
        <button class="btn">Activar</button>
      </div>

    </section>

    <section class="control-panel">
      <h2>Control rápido</h2>

      <div class="buttons">
        <button class="primary">Abrir Puerta</button>
        <button class="danger">Cerrar Puerta</button>
      </div>
    </section>

</main>
</body>
</html>
