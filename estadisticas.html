<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadisticas Petdoor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">

    <div class="logo">

        <img src="img/logo.png" alt="Logo Petdoor">

        <span>
            <span class="logo-p">P</span>etdoor
        </span>

    </div>

    <ul class="nav-links">

        <li><a href="index.html">Inicio</a></li>
        <li><a href="estadisticas.html">Estadísticas</a></li>

    </ul>
</nav>

<section class="app-section">

    <div class="phone">

        <div class="screen">
            <!-- ESTADISTICAS -->

            <div class="stats-section">

                <h3>Estadísticas semanales</h3>

                <div class="stats-cards">

                    <div class="stat-card">

                        <p>Entradas</p>

                        <h2>24</h2>

                    </div>

                    <div class="stat-card">

                        <p>Salidas</p>

                        <h2>22</h2>

                    </div>

                    <div class="stat-card">

                        <p>Promedio diario</p>

                        <h2>6</h2>

                    </div>

                </div>

            </div>

            <!-- GRAFICO -->

            <div class="chart-section">

                <h3>Horarios de actividad</h3>

                <div class="chart">

                    <div class="bar" style="height:60%;">
                        <span>8hs</span>
                    </div>

                    <div class="bar" style="height:85%;">
                        <span>10hs</span>
                    </div>

                    <div class="bar" style="height:45%;">
                        <span>13hs</span>
                    </div>

                    <div class="bar" style="height:95%;">
                        <span>18hs</span>
                    </div>

                </div>

            </div> 

        </div>

    </div>

</section>

</body>
</html>
