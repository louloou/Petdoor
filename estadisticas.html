<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas Petdoor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

        <div class="logo">
            <img src="img/logo.png" alt="Logo Petdoor">

            <span>
                <span class="logo-p">P</span>etdoor
            </span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="estadisticas.html">Estadísticas</a></li>
        </ul>

    </nav>

    <section class="app-section">

        <div class="phone">

            <div class="screen">

                <!-- ESTADÍSTICAS -->
                <div class="stats-section">

                    <h3>Actividad de la mascota</h3>

                    <div class="stats-cards">

                        <div class="stat-card">
                            <p>Entradas</p>
                            <h2 id="entradas">0</h2>
                        </div>

                        <div class="stat-card">
                            <p>Salidas</p>
                            <h2 id="salidas">0</h2>
                        </div>

                        <div class="stat-card">
                            <p>Hora pico</p>
                            <h2 id="horarioFrecuente">--</h2>
                        </div>

                    </div>

                </div>

                <!-- GRÁFICO -->
                <div class="chart-section">

                    <h3>Horarios de actividad</h3>

                    <div class="chart" id="grafico"></div>

                </div>

                <!-- ÚLTIMOS MOVIMIENTOS -->
                <div class="logs">

                    <h3>Últimos movimientos</h3>

                    <ul id="listaMovimientos">
                        <li>Cargando...</li>
                    </ul>

                </div>

            </div>

        </div>

    </section>

    <script type="module" src="estadisticas.js"></script>

</body>
</html>
